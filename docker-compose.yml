# EventNexus — Local development compose
# Usage: docker compose up --build
# Env files are read from ./backend/.env, ./ai-service/.env, ./frontend/.env.local (see .env.example)

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: eventnexus-backend
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    environment:
      # Ensure AI service is reachable by service name inside the network
      AI_SERVICE_URL: http://ai-service:8000
    depends_on:
      ai-service:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:5000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:5000/api
    container_name: eventnexus-frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:5000/api
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: eventnexus-ai
    ports:
      - "8000:8000"
    env_file:
      - ./ai-service/.env
    volumes:
      # Persist trained models between restarts (host ./ai-service/models -> container /app/models)
      - ./ai-service/models:/app/models
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

networks:
  default:
    name: eventnexus
